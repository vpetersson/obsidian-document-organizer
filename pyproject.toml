[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scanvault"
version = "0.24.0"
description = "OCR scanned PDFs and organize them into an Obsidian vault with ollama or Apple Intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# pypdf gives faster, dependency-free text extraction; poppler's pdftotext is used otherwise.
fast = [
    "fonttools>=4.67.0",
    "pypdf[crypto]>=6.21.1",
]
# Apple Intelligence's on-device model (`provider = "apple"`); macOS 26+ only.
apple = [
    "apple-fm-sdk>=0.2.1; sys_platform == 'darwin'",
]

[project.scripts]
scanvault = "scanvault.cli:main"

[project.urls]
Homepage = "https://github.com/vpetersson/obsidian-document-organizer"

[tool.setuptools.packages.find]
include = ["scanvault*"]
