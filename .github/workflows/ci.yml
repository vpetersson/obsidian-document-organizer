name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        extras: [""]
        label: [""]
        include:
          # pypdf is optional; this job exercises that extraction path too.
          - python-version: "3.12"
            extras: "--extra fast"
            label: " + pypdf"
    steps:
      - uses: actions/checkout@v4

      - name: Install the OCR toolchain
        # Without these the OCR tests skip themselves, so CI must provide them.
        run: |
          # The runner image carries third-party repositories we never install
          # from, and a hash mismatch in one of them fails the whole update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          for attempt in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $attempt); retrying"
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends \
            ocrmypdf tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Sync the environment
        run: uv sync --python ${{ matrix.python-version }} ${{ matrix.extras }}

      - name: Show the detected toolchain
        run: uv run --python ${{ matrix.python-version }} scanvault doctor

      - name: Run the test suite
        run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -t . -v
